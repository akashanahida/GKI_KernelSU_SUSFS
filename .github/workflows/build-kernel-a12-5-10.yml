name: 编译内核 a12-5.10
permissions:
  contents: write  # 允许写入仓库内容（用于推送标签）
  actions: write   # 允许触发 actions

on:
  workflow_dispatch:
    inputs:
      sub_level:
        description: '内核子级别 (例如: 198)'
        required: true
        type: string
      os_patch_level:
        description: '操作系统安全补丁级别 (例如: 2023-10)'
        required: true
        type: string
      revision:
        description: 'GKI 修订版本号 (例如: r1)'
        required: false
        type: string
      version:
        description: '自定义版本名 (留空则使用默认版本号)'
        required: false
        type: string
      use_zram:
        description: '是否开启并集成更多ZRAM算法?'
        required: true
        type: boolean
        default: true
      onlyAk3:
        description: '仅上传AK3压缩包? (无boot镜像, 下载更快)'
        required: false
        type: boolean
        default: false

jobs:
  build-kernel-a12-5-10:
    # 调用我们之前创建的简化的、可重用的 GKI 构建工作流程
    # 请确保将 `gki-build-simplified.yml` 替换为你的实际文件名
    uses: ./.github/workflows/gki-build-simplified.yml
    secrets: inherit
    with:
      # 硬编码此文件特定的构建参数
      android_version: 'android12'
      kernel_version: '5.10'
      make_release: false

      # 从上方的 inputs 传递用户选择的参数
      sub_level: ${{ inputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: ${{ inputs.revision }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      onlyAk3: ${{ inputs.onlyAk3 }}
